{% extends "base.html" %}

{% block title %}Connexion — Drive2School{% endblock %}

{% block content %}
<div class="container narrow">
    <div class="form-card">
        <span class="eyebrow">DRIVE2SCHOOL</span>
        <h1>Connexion</h1>
        <p class="muted">Connectez-vous pour gérer vos trajets et réservations.</p>

        <form method="post" class="styled-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button button-primary full" type="submit">Se connecter</button>
        </form>

        <p class="form-footer">
            Pas encore de compte ?
            <a href="{% url 'register' %}">Créer un compte</a>
        </p>
    </div>
</div>
{% endblock %}
